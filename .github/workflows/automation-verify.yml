name: Automation verification

on:
  pull_request:
  push:
    branches:
      - main
      - codex/main-street-automation

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile automation
        run: python -m py_compile automation.py
      - name: Run deterministic safety tests
        run: python automation.py verify
