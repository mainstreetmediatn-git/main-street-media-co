name: Production CI

on:
  push:
    branches: [master, reconcile/production-main, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  datadog-synthetics:
    runs-on: ubuntu-latest
    needs: validate
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
      DD_TEST_QUERY: ${{ vars.DATADOG_SYNTHETICS_TEST_SEARCH_QUERY }}
    steps:
      - name: Explain skipped Datadog checks
        if: ${{ env.DD_API_KEY == '' || env.DD_APP_KEY == '' || env.DD_TEST_QUERY == '' }}
        run: echo "Datadog Synthetics skipped because credentials or a real test query are not configured."
      - name: Run configured Datadog Synthetic tests
        if: ${{ env.DD_API_KEY != '' && env.DD_APP_KEY != '' && env.DD_TEST_QUERY != '' }}
        uses: DataDog/synthetics-ci-github-action@87b505388a22005bb8013481e3f73a367b9a53eb
        with:
          api_key: ${{ secrets.DD_API_KEY }}
          app_key: ${{ secrets.DD_APP_KEY }}
          test_search_query: ${{ env.DD_TEST_QUERY }}
